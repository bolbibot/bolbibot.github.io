services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_API_URL: http://bot-api:8081
    depends_on:
      - bot-api
    volumes:
      - ./data:/app/data
      - bot-tmp:/app/tmp

  # Свой сервер Bot API: позволяет отправлять файлы до 2 ГБ (обычный лимит — 50 МБ)
  bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api

  # Нужен только для оплаты картой: docker compose --profile robokassa up -d
  caddy:
    image: caddy:2
    profiles: ["robokassa"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - bot

volumes:
  bot-tmp:
  bot-api-data:
  caddy-data:
